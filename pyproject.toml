[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emqx-client-monitor"
dynamic = ["version"]
description = "Prometheus-compatible exporter/monitor for watching EMQX MQTT clients."
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
keywords = [
  "emqx",
  "mqtt",
  "monitoring",
  "prometheus",
  "exporter",
  "iot"
]
authors = [
  { name = "Daniel Skowroński", email = "daniel@skowron.ski" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click",
]

[project.urls]
Documentation = "https://github.com/Daniel Skowroński/emqx-client-monitor#readme"
Issues = "https://github.com/Daniel Skowroński/emqx-client-monitor/issues"
Source = "https://github.com/Daniel Skowroński/emqx-client-monitor"

[project.scripts]
emqx-client-monitor = "emqx_client_monitor.cli:emqx_client_monitor"

[tool.hatch.version]
path = "src/emqx_client_monitor/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/emqx_client_monitor tests}"

[tool.coverage.run]
source_pkgs = ["emqx_client_monitor", "tests"]
branch = true
parallel = true
omit = [
  "src/emqx_client_monitor/__about__.py",
]

[tool.coverage.paths]
emqx_client_monitor = ["src/emqx_client_monitor", "*/emqx-client-monitor/src/emqx_client_monitor"]
tests = ["tests", "*/emqx-client-monitor/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
